<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f6fb" />
    <title>DMT — Offline</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #302b36; background: #f8f6fb; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #e8e2ee; border-radius: 24px; background: rgba(255,255,255,.82); box-shadow: 0 18px 48px rgba(56,40,74,.08); text-align: center; }
      .mark { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 18px; color: #725991; background: #f1ebf8; font-size: 24px; font-weight: 700; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #696371; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">D</div>
      <h1>Koneksi sedang tidak tersedia</h1>
      <p>DMT tidak menyimpan pesanan atau informasi pribadi untuk dibuka secara offline. Sambungkan kembali ke internet untuk melanjutkan.</p>
    </main>
  </body>
</html>
